<section id="myCard" class="media-card">
  <figure class="media-card__figure">
    {{#Imagen}}
    <div class="video-wrapper">
      <div class="video-container">
        <canvas id="ambient-canvas"></canvas>
        <video
          id="videoAnki"
          src="{{Imagen}}"
          width="100%"
          preload="metadata"
          playsinline
        ></video>
        <button
          id="playPauseBottomBtn"
          class="video-control-button-bottom"
          aria-label="Reproducir/Pausar"
        >
          <svg
            class="icon icon-play"
            viewBox="0 0 24 24"
            width="70%"
            height="70%"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M8 6 L19 12 L8 18 Z" />
          </svg>
          <svg
            class="icon icon-pause"
            viewBox="0 0 24 24"
            width="70%"
            height="70%"
            fill="currentColor"
            aria-hidden="true"
          >
            <rect
              x="6"
              y="5"
              width="4"
              height="14"
              rx="2"
              ry="2"
            ></rect>
            <rect
              x="14"
              y="5"
              width="4"
              height="14"
              rx="2"
              ry="2"
            ></rect>
          </svg>
        </button>
      </div>
    </div>
    {{/Imagen}}
  </figure>
  <!-- FIN Contenedor Media -->

  {{#Ingles}}
  <p class="media-card__expression">
    <span class="media-card__expression-text"
      >{{Ingles}}</span
    >
  </p>
  {{/Ingles}}

  <script>
    function initializeAmbientMode(videoElement) {
      const canvas = document.getElementById(
        'ambient-canvas'
      );
      const ctx = canvas.getContext('2d');

      if (!videoElement || !canvas) return;

      canvas.width = 16;
      canvas.height = 9;

      let animationFrameId;

      function drawGlow() {
        if (videoElement.paused || videoElement.ended) {
          ctx.drawImage(
            videoElement,
            0,
            0,
            canvas.width,
            canvas.height
          );
          cancelAnimationFrame(animationFrameId);
          return;
        }

        ctx.drawImage(
          videoElement,
          0,
          0,
          canvas.width,
          canvas.height
        );
        animationFrameId = requestAnimationFrame(drawGlow);
      }

      videoElement.addEventListener('play', () => {
        canvas.classList.add('glow-active');
        cancelAnimationFrame(animationFrameId);
        drawGlow();
      });
    }

    function togglePlayPauseVideo(event) {
      var currentVideo =
        document.getElementById('videoAnki');

      if (!currentVideo) return;
      if (event) {
        event.stopPropagation();
      }
      if (currentVideo.paused || currentVideo.ended) {
        currentVideo.muted = false;
        if (currentVideo.readyState === 0) {
          currentVideo.load();
        }
        currentVideo.play().catch((e) => {});
      } else {
        currentVideo.pause();
      }
    }

    function updateVideoBottomButtonState() {
      var currentVideo =
        document.getElementById('videoAnki');
      var currentButton = document.getElementById(
        'playPauseBottomBtn'
      );

      if (!currentVideo || !currentButton) return;

      const isPaused =
        currentVideo.paused || currentVideo.ended;

      currentButton.classList.toggle(
        'is-playing',
        !isPaused
      );
      currentButton.setAttribute(
        'aria-label',
        isPaused ? 'Reproducir' : 'Pausar'
      );
    }

    function setupVideoPlayer() {
      var videoElement =
        document.getElementById('videoAnki');

      if (videoElement) {
        var videoContainer = videoElement.closest(
          '.video-container'
        );

        if (videoContainer) {
          videoContainer.addEventListener(
            'click',
            togglePlayPauseVideo
          );
        }

        initializeAmbientMode(videoElement);
        videoElement.classList.remove('video-ready');

        const makeVideoVisible = () => {
          videoElement.classList.add('video-ready');
          videoElement.removeEventListener(
            'loadeddata',
            makeVideoVisible
          );
        };

        if (videoElement.readyState >= 2) {
          makeVideoVisible();
        } else {
          videoElement.addEventListener(
            'loadeddata',
            makeVideoVisible
          );
        }

        videoElement.addEventListener(
          'play',
          updateVideoBottomButtonState
        );
        videoElement.addEventListener(
          'pause',
          updateVideoBottomButtonState
        );
        videoElement.addEventListener(
          'ended',
          updateVideoBottomButtonState
        );
        updateVideoBottomButtonState();
        videoElement.muted = false;

        var playPromise = videoElement.play();
        if (playPromise !== undefined) {
          playPromise.catch((error) => {});
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener(
        'DOMContentLoaded',
        setupVideoPlayer
      );
    } else {
      setupVideoPlayer();
    }
  </script>
</section>
