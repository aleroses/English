<section id="myCard" class="media-card">
  <figure class="media-card__figure">
    {{#video}}
    <div class="media-card__video-container">
      <canvas
        id="ambient-canvas"
        class="media-card__canvas"
      ></canvas>
      <video
        id="videoAnki"
        class="media-card__video"
        src="{{video}}"
        width="100%"
        preload="none"
        playsinline
      ></video>
    </div>
    {{/video}}
  </figure>
  <!-- FIN Contenedor Media -->

  <!-- Campo Ingles (con la reducción anterior) -->
  {{#english_dialogs}}
  <p class="media-card__expression">
    <span class="media-card__expression-text"
      >{{english_dialogs}}</span
    >
  </p>
  {{/english_dialogs}} {{#spanish_dialogues}}

  <hr class="media-card__divider" />
  <p class="media-card__meaning">
    <span class="media-card__meaning-text"
      >{{spanish_dialogues}}</span
    >
  </p>
  {{/spanish_dialogues}}

  <aside class="media-card__extra">
    {{#notes}}
    <div class="media-card__notes">{{notes}}</div>
    {{/notes}}
    <figure class="media-card__notes-figure"></figure>
  </aside>

  <div class="media-card__audio" hidden></div>

  <footer class="media-card__footer">
    <button
      id="playPauseOutsideBtn"
      class="media-card__play-button"
      aria-label="Reproducir/Pausar"
    >
      <svg
        class="icon icon-play"
        viewBox="0 0 24 24"
        width="70%"
        height="70%"
        fill="currentColor"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M8 6 L19 12 L8 18 Z" />
      </svg>
      <svg
        class="icon icon-pause"
        viewBox="0 0 24 24"
        width="70%"
        height="70%"
        fill="currentColor"
        aria-hidden="true"
      >
        <rect
          x="6"
          y="5"
          width="4"
          height="14"
          rx="2"
          ry="2"
        ></rect>
        <rect
          x="14"
          y="5"
          width="4"
          height="14"
          rx="2"
          ry="2"
        ></rect>
      </svg>
    </button>
  </footer>

  <script>
    // --- Funciones del Video (sin cambios de comportamiento, solo BEM) ---
    function initializeAmbientMode(videoElement) {
      const canvas = document.getElementById(
        'ambient-canvas'
      );
      if (!videoElement || !canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = 16;
      canvas.height = 9;
      let animationFrameId;
      function drawGlow() {
        if (videoElement.paused || videoElement.ended) {
          ctx.drawImage(
            videoElement,
            0,
            0,
            canvas.width,
            canvas.height
          );
          cancelAnimationFrame(animationFrameId);
          return;
        }
        ctx.drawImage(
          videoElement,
          0,
          0,
          canvas.width,
          canvas.height
        );
        animationFrameId = requestAnimationFrame(drawGlow);
      }
      videoElement.addEventListener('play', () => {
        canvas.classList.add('media-card__canvas--active');
        cancelAnimationFrame(animationFrameId);
        drawGlow();
      });
    }
    function togglePlayPauseVideo(event) {
      var v = document.getElementById('videoAnki');
      if (!v) return;
      if (event) {
        event.stopPropagation();
      }
      if (v.paused || v.ended) {
        v.muted = false;
        if (v.readyState === 0) {
          v.load();
        }
        v.play().catch((e) => {});
      } else {
        v.pause();
      }
    }
    function updateVideoUI() {
      var v = document.getElementById('videoAnki');
      var buttons = document.querySelectorAll(
        '.media-card__play-button'
      );
      if (!v || !buttons.length) return;
      const isPaused = v.paused || v.ended;
      buttons.forEach((btn) => {
        btn.classList.toggle(
          'media-card__play-button--playing',
          !isPaused
        );
        btn.setAttribute(
          'aria-label',
          isPaused ? 'Reproducir' : 'Pausar'
        );
      });
    }

    // --- Función Principal que se ejecuta al mostrar el reverso ---
    function setupReverseCard() {
      var outsideButton = document.getElementById(
        'playPauseOutsideBtn'
      );
      if (outsideButton) {
        outsideButton.addEventListener(
          'click',
          togglePlayPauseVideo
        );
      }

      var videoElement =
        document.getElementById('videoAnki');
      if (videoElement) {
        var videoContainer = videoElement.closest(
          '.media-card__video-container'
        );
        if (videoContainer) {
          videoContainer.addEventListener(
            'click',
            togglePlayPauseVideo
          );
        }
        initializeAmbientMode(videoElement);
        const makeVideoVisible = () => {
          videoElement.classList.add(
            'media-card__video--ready'
          );
          updateVideoUI();
        };
        if (videoElement.readyState >= 2) {
          makeVideoVisible();
        } else {
          videoElement.addEventListener(
            'loadeddata',
            makeVideoVisible,
            {
              once: true,
            }
          );
        }
        videoElement.addEventListener(
          'play',
          updateVideoUI
        );
        videoElement.addEventListener(
          'pause',
          updateVideoUI
        );
        videoElement.addEventListener(
          'ended',
          updateVideoUI
        );
        updateVideoUI();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener(
        'DOMContentLoaded',
        setupReverseCard
      );
    } else {
      setTimeout(setupReverseCard, 0);
    }
  </script>
</section>

<!-- {{FrontSide}} -->
