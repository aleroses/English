<div class="custom-card back">
  <header class="header">
    <h1 class="header__word">{{word}}</h1>
  </header>

  <main class="main">
    <section class="main__definition">
      <ul class="main__definition--list">
        <li>{{definition_01}}</li>

        {{#definition_02}}
        <li>{{definition_02}}</li>
        {{/definition_02}}
      </ul>
    </section>
    <section class="main__verbs">
      <ul class="main__verbs--list">
        <li>{{irregular_verb_01}}</li>
        <li>{{irregular_verb_02}}</li>
        <li>{{irregular_verb_03}}</li>
      </ul>
    </section>
  </main>

  <section class="sentence">
    <p>{{type:sentence}}</p>
    <div class="">{{hint:translation}}</div>
  </section>

  <footer class="audio">
    <div class="audio_word">{{word_audio}}</div>
    <div class="audio_pause">{{pause}}</div>
    <div class="audio_sentence">{{sentence_audio}}</div>
  </footer>
</div>
