<div class="flashcard card--front">
  <header class="header glass">
    <p class="header__title">
      Write the sentence you hear.
    </p>

    <h1 class="header__word">{{word}}</h1>
  </header>

  <section class="audio" aria-label="Word audio controls">
    <div class="audio__button">{{word_audio}}</div>

    <div class="audio__button">{{pause}}</div>

    <div class="audio__button">{{sentence_audio}}</div>
  </section>

  <section class="answer">{{type:sentence}}</section>
</div>
