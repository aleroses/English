<div class="custom-card front">
  <header class="header">
    <h1 class="header__title">
      Write the sentence you hear.
    </h1>
    <h2 class="header__word">{{word}}</h2>
  </header>

  <section class="audio">
    <div class="audio__word">{{word_audio}}</div>
    <div class="audio__pause">{{pause}}</div>
    <div class="audio__sentence">{{sentence_audio}}</div>
  </section>

  <div class="sentence">{{type:sentence}}</div>
</div>
